name: Backend Security Audit, Unit Tests & Policy Gate

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/security-review.yml'
  pull_request:
    paths:
      - 'server/**'

jobs:
  backend-test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          cd server
          pip install -r requirements.txt
          pip install pytest httpx mongomock

      - name: Run Backend Unit Tests
        run: |
          cd server
          python -m pytest tests/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Report Compiler Dependencies
        run: |
          cd PerioTwinE2E
          npm install exceljs

      - name: Run Backend Security Scan
        env:
          NODE_PATH: ../PerioTwinE2E/node_modules
        run: |
          cd server
          node scripts/generateSecuritySuite.js

      - name: Publish Security Audit to Step Summary
        run: |
          if [ -f "server/Test_Results/executive-summary.md" ]; then
            cat server/Test_Results/executive-summary.md >> $GITHUB_STEP_SUMMARY
            echo "---" >> $GITHUB_STEP_SUMMARY
            cat server/Test_Results/security-review.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Enforce Zero-Critical Security Policy Gate
        run: |
          SUMMARY_FILE="server/Test_Results/executive-summary.md"
          if [ -f "$SUMMARY_FILE" ]; then
            # Extract the count next to 'Critical' using grep
            CRIT_LINE=$(grep -E 'Critical' "$SUMMARY_FILE" || true)
            echo "Security Gate Line: $CRIT_LINE"
            # Extract number
            CRIT_COUNT=$(echo "$CRIT_LINE" | grep -oE '[0-9]+' | head -n 1 || echo "0")
            echo "Extracted Critical Vulnerabilities: $CRIT_COUNT"
            if [ "$CRIT_COUNT" -gt 0 ]; then
              echo "❌ ERROR: Zero-Critical Security Policy violated ($CRIT_COUNT critical findings found)."
              exit 1
            else
              echo "✅ PASS: Zero-Critical Security Policy verified."
            fi
          else
            echo "⚠️ Warning: Executive summary file not found, skipping security gate checks."
          fi
