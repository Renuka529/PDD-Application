name: Deploy Web Application & E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Client Dependencies
        run: |
          cd client
          npm install

      - name: Build Web Application
        run: |
          cd client
          npm run build

      - name: Start Background Vite Preview
        run: |
          cd client
          npx vite preview --port 5173 --host 127.0.0.1 --base /PDD-Application/ &
          echo "Vite preview started in background."
          sleep 5
          curl -I http://127.0.0.1:5173/PDD-Application/ || echo "Waiting for server..."
          echo "TEST_BASE_URL=http://127.0.0.1:5173/PDD-Application/" >> $GITHUB_ENV

      - name: Install E2E Dependencies
        run: |
          cd PerioTwinE2E
          npm install

      - name: Run Selenium E2E Tests
        run: |
          cd PerioTwinE2E
          npm test || echo "⚠️ Some tests failed. Proceeding with report compilation."

      - name: Run Web Security Suite
        run: |
          cd PerioTwinE2E
          node scripts/generateWebSecuritySuite.js

      - name: Inject Reports into Web Dist Bundle
        run: |
          mkdir -p client/dist/reports/latest
          mkdir -p client/dist/reports/history/build-${{ github.run_number }}

          # Copy Selenium Reports
          if [ -d "PerioTwinE2E/Test_Results" ]; then
            cp -r PerioTwinE2E/Test_Results/* client/dist/reports/latest/
            cp -r PerioTwinE2E/Test_Results/* client/dist/reports/history/build-${{ github.run_number }}/
          fi

      - name: Publish Test summaries to Step Summary
        run: |
          echo "### 🌐 Web E2E Selenium Testing Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f "PerioTwinE2E/Test_Results/web-executive-summary.md" ]; then
            cat PerioTwinE2E/Test_Results/web-executive-summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "E2E Run completed. Reports generated." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'client/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
