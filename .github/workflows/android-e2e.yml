name: Android Mobile Appium E2E Automation

on:
  push:
    paths:
      - 'mobile/**'
      - 'PerioTwinAppium/**'
      - '.github/workflows/android-e2e.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'PerioTwinAppium/**'

jobs:
  android-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.19.0' # Adjust based on pubspec requirements

      - name: Build Android Debug APK
        run: |
          cd mobile
          flutter pub get
          flutter build apk --debug

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium & WDIO dependencies
        run: |
          cd PerioTwinAppium
          npm install

      - name: Enable KVM Hardware Acceleration
        run: |
          echo "Checking KVM acceleration support..."
          egrep -c '(vmx|svm)' /proc/cpuinfo || true
          sudo adduser $USER kvm || true

      - name: Run Appium Tests in Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          script: |
            cd PerioTwinAppium
            chmod +x scripts/ci_run_tests.sh
            ./scripts/ci_run_tests.sh

      - name: Publish Step Summary
        run: |
          if [ -f "PerioTwinAppium/Test_Results/appium-summary.md" ]; then
            cat PerioTwinAppium/Test_Results/appium-summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Deploy Reports to GitHub Pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: PerioTwinAppium/Test_Results
          target-folder: reports/mobile
          branch: gh-pages
          clean: false
